      name: Le Monde
      country: FR
      language: fr
      section: NEWS
      feed-urls:
        - https://www.lemonde.fr/rss/une.xml
    - code: elpais
      name: El País
      country: ES
      language: es
      section: NEWS
      feed-urls:
        - https://feeds.elpais.com/mrss-s/pages/ep/site/elpais.com/portada

    # --- Grossbritannien ---
    - code: guardian
      name: The Guardian
      country: GB
      language: en
      section: NEWS
      feed-urls:
