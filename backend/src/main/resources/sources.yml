# Quellenkatalog. Wird beim Start in die Tabellen `source` und `source_feed`
# synchronisiert: neue Codes und Feeds werden angelegt, bestehende aktualisiert,
# entfernte deaktiviert (nicht gelöscht).
#
# Eine Quelle ist eine Redaktion, ein Feed nur ein Zugang. Mehrere Feeds derselben
# Redaktion (z.B. World und Startseite) gehören unter dieselbe Quelle; doppelte
# Artikel werden über die URL erkannt und nur einmal gespeichert.
#
# section: NEWS oder OPINION  (Meinung bewusst als eigene Quelle führen)
# camp:    dein eigenes Lager-Tag, frei wählbar, vorerst leer
# country: ISO-Code (CH, DE, FR, ES, US, GB, AR, ...)
#
# Einordnung (alles optional, Tippfehler brechen den Start ab):
#   ownership:   privat (Standard) | oeffentlich | staatlich | parteien
#                oeffentlich = Gebühren/Staat, redaktionell unabhängig (SRF, BBC)
#                staatlich   = die Regierung bestimmt die Linie
#                parteien    = nimmt Geld von Parteien
#   lean:        links | mitte-links | mitte | mitte-rechts | rechts | keine
#                keine = links/rechts passt nicht (Staatsmedien, Parteigeld, Besitzerinteressen)
#                leer  = noch nicht eingeordnet
#   lean-source: allsides | eigene (Standard, sobald lean gesetzt ist)
#   note:        Freitext für den Tooltip
#
# Feeds geprüft am 2.11.2026, neue am 5.11.2026 (HTTP 200, Einträge vorhanden).

