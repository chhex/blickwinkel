# Quellenkatalog. Wird beim Start in die Tabellen `source` und `source_feed`
# synchronisiert: neue Codes und Feeds werden angelegt, bestehende aktualisiert,
# entfernte deaktiviert (nicht gelöscht).
#
# Eine Quelle ist eine Redaktion, ein Feed nur ein Zugang. Mehrere Feeds derselben
# Redaktion (z.B. World und Startseite) gehören unter dieselbe Quelle; doppelte
# Artikel werden über die URL erkannt und nur einmal gespeichert.
#
# section: NEWS oder OPINION  (Meinung bewusst als eigene Quelle führen)
# camp:    dein eigenes Lager-Tag, frei wählbar, vorerst leer
# country: ISO-Code (CH, DE, FR, ES, US, GB)
#
# Alle Feeds geprüft am 2.11.2026 (HTTP 200, Einträge vorhanden).

blickwinkel:
  sources:
    # --- Schweiz ---
    - code: nzz
      name: NZZ
      country: CH
      language: de
      section: NEWS
      feed-urls:
        - https://www.nzz.ch/recent.rss
    - code: nzz-meinung
      name: NZZ Meinung
      country: CH
      language: de
      section: OPINION
      feed-urls:
        - https://www.nzz.ch/meinung.rss
    - code: srf
      name: SRF News
      country: CH
      language: de
      section: NEWS
      feed-urls:
        - https://www.srf.ch/news/bnf/rss/1646
    - code: tagesanzeiger
      name: Tages-Anzeiger
      country: CH
      language: de
      section: NEWS
      feed-urls:
        - https://partner-feeds.publishing.tamedia.ch/rss/tagesanzeiger/ticker
    - code: watson
      name: watson
      country: CH
      language: de
      section: NEWS
      feed-urls:
        - https://www.watson.ch/api/2.0/rss/index.xml
    - code: infosperber
      name: Infosperber
      country: CH
      language: de
      section: NEWS
      feed-urls:
        - https://www.infosperber.ch/feed/
    - code: letemps
      name: Le Temps
      country: CH
      language: fr
      section: NEWS
      feed-urls:
        - https://www.letemps.ch/articles.rss
    # Weltwoche, WOZ, Nebelspalter, Republik: Feed-URL noch offen

    # --- Deutschland ---
    - code: spiegel
      name: Der Spiegel
      country: DE
      language: de
      section: NEWS
      feed-urls:
