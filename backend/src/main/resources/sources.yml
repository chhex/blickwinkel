# Quellenkatalog. Wird beim Start in die Tabelle `source` synchronisiert:
# neue Codes werden angelegt, bestehende aktualisiert, entfernte deaktiviert.
#
# section: NEWS oder OPINION  (Meinung bewusst als eigene "Quelle" führen)
# camp:    dein eigenes Lager-Tag, frei wählbar, vorerst leer
#
# Status der Feed-URLs (geprüft am 2026-10-17):
#   [ok]   Feed abgerufen und als RSS/Atom erkannt
#   [?]    aus Verzeichnis/Doku übernommen, beim ersten Lauf im Log prüfen

blickwinkel:
  sources:
    # --- Schweiz ---
    - code: nzz
      name: NZZ
      country: CH
      language: de
      section: NEWS
      feed-url: https://www.nzz.ch/recent.rss                # [?] laut Feed-Verzeichnis
    - code: nzz-meinung
      name: NZZ Meinung
      country: CH
      language: de
      section: OPINION
      feed-url: https://www.nzz.ch/meinung.rss               # [?]
    - code: srf
      name: SRF News
      country: CH
      language: de
      section: NEWS
