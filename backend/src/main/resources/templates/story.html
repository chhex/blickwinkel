<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${story.title})}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('stories')}"></nav>

<main class="container">
    <p><a th:href="@{/stories}">← Alle Stories</a></p>

    <hgroup>
        <h1 th:text="${story.title}">Titel</h1>
        <p th:text="${total} + ' Artikel · ' + ${@fmt.span(story.firstSeenAt, story.lastSeenAt)}">
            4 Artikel · 01.11. 16:33 – 23:35
        </p>
    </hgroup>

    <!--
      Filter wie auf der Übersicht: htmx lädt bei jeder Änderung nur die Tabelle neu und
      schreibt die Auswahl in die URL. Angekreuzt heisst «nur diese»; nichts angekreuzt heisst alle.
      Merkmale mit nur einer Ausprägung (z.B. alles deutsch) erscheinen nicht.
    -->
    <form class="facets" th:action="@{/stories/{id}(id=${story.id})}" method="get"
          th:if="${facets.quellen.size() > 1 or facets.sprachen.size() > 1 or facets.laender.size() > 1}"
          th:hx-get="@{/stories/{id}(id=${story.id})}" hx-target="#articles" hx-swap="outerHTML"
          hx-trigger="change" hx-push-url="true">
        <fieldset th:if="${facets.quellen.size() > 1}">
            <legend>Quelle</legend>
            <label th:each="o : ${facets.quellen}">
                <input type="checkbox" name="quelle" th:value="${o.code}"
                       th:checked="${filter.quellen.contains(o.code)}">
                <span th:text="${o.label}">NZZ</span> <small class="muted" th:text="${o.count}">2</small>
            </label>
        </fieldset>
        <fieldset th:if="${facets.sprachen.size() > 1}">
            <legend>Sprache</legend>
            <label th:each="o : ${facets.sprachen}">
                <input type="checkbox" name="sprache" th:value="${o.code}"
                       th:checked="${filter.sprachen.contains(o.code)}">
                <span th:text="${o.label}">DE</span> <small class="muted" th:text="${o.count}">3</small>
            </label>
        </fieldset>
        <fieldset th:if="${facets.laender.size() > 1}">
            <legend>Land</legend>
            <label th:each="o : ${facets.laender}">
                <input type="checkbox" name="land" th:value="${o.code}"
                       th:checked="${filter.laender.contains(o.code)}">
                <span th:text="${o.label}">CH</span> <small class="muted" th:text="${o.count}">3</small>
            </label>
        </fieldset>
    </form>

    <section id="articles" th:fragment="articles">
        <p class="muted count" th:unless="${filter.empty}">
            <span th:text="${articles.size()} + ' von ' + ${total} + ' Artikeln'">2 von 4 Artikeln</span> ·
            <a th:href="@{/stories/{id}(id=${story.id})}">alle anzeigen</a>
        </p>
        <p th:if="${articles.isEmpty()}" class="muted">Keine Artikel für diese Auswahl.</p>

        <div class="overflow-auto" th:unless="${articles.isEmpty()}">
            <table class="striped">
                <thead>
                <tr>
                    <th>Zeit</th>
                    <th>Quelle</th>
                    <th>Schlagzeile</th>
                    <th title="Ähnlichkeit zum Mittelpunkt der Story beim Zuordnen. 1.00 = Gründer der Story">Ähnl.</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="a : ${articles}">
                    <td class="nowrap">
                        <small th:text="${@fmt.time(a.publishedAt)}">01.11. 16:33</small>
                        <span th:if="${a.id == firstId}" class="badge first"
                              title="Erster Artikel dieser Story">zuerst</span>
                    </td>
                    <td th:with="src=${catalog.of(a.sourceCode)}">
                        <strong th:text="${a.source}">NZZ</strong><br>
                        <span th:replace="~{fragments/source :: badge(${src}, false, true)}">CH ◐ L ○○○●○ R mitte-rechts</span>
                        <small class="muted" th:text="${a.language}">de</small>
                        <span th:if="${a.section == 'OPINION'}" class="badge opinion">Meinung</span>
                    </td>
                    <!-- Titel, Teaser und Übersetzungs-Knöpfe: eigenes Fragment, damit htmx es austauschen kann -->
                    <td th:with="t=${a}, tr=${null}, err=${null}">
                        <div th:replace="~{article-text :: text}"></div>
                    </td>
                    <td th:text="${@fmt.sim(a.similarity)}">0.75</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
