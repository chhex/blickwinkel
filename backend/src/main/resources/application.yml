spring:
  application:
    name: blickwinkel
  config:
    import:
      - classpath:sources.yml
      # Lokal (mvn spring-boot:run im Projektordner): .env direkt einlesen.
      # Im Container fehlt die Datei; dort kommen die Werte als Umgebungsvariablen.
      - optional:file:../.env[.properties]
  datasource:
    # Ohne POSTGRES_* bricht der Start bewusst ab (strikt, kein Standardpasswort)
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  web:
    resources:
      # Cache-Busting: Spring hängt einen Inhalts-Hash an CSS/JS (app-3f2a9c….css), Thymeleaf
      # schreibt die Links in @{...} automatisch um. Jede Änderung ergibt eine neue URL, kein
      # Cache (Browser, Cloudflare) kann Veraltetes liefern, und alte URLs dürfen lange gelten.
      chain:
        strategy:
          content:
            enabled: true
            paths: /**
      cache:
        cachecontrol:
          max-age: 365d
          cache-public: true

server:
  # Hinter Cloudflare: X-Forwarded-Proto/Host auswerten, damit Weiterleitungen https behalten.
  # Unbedenklich, weil die App nur auf 127.0.0.1 lauscht und alles über den Tunnel kommt.
  forward-headers-strategy: framework

blickwinkel:
  ingest:
    interval: PT20M
    timeout: PT20S
    teaser-max-length: 1000
    user-agent: "Blickwinkel/0.1 (private news comparison)"
  embedding:
    interval: PT1M
    base-url: ${OLLAMA_URL:http://localhost:11434}
    model: bge-m3
    dimensions: 1024          # muss zu vector(1024) im Schema passen
    batch-size: 32
  clustering:
    interval: PT1M
    similarity-threshold: 0.70  # kalibriert am 31.10.2026 mit echten Daten
    window: PT48H
    batch-size: 200
  translation:
    # Optional: ohne Schlüssel ist die Übersetzung aus (keine Knöpfe im UI)
    deepl-api-key: ${DEEPL_API_KEY:}
    deepl-base-url:           # leer = automatisch (":fx"-Schlüssel -> api-free.deepl.com)
    target-languages: [de, en, es]

logging:
  level:
    ch.chhex.blickwinkel: INFO
