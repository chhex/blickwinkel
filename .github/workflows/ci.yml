# Prüft jeden Pull Request: Build, Tests und Compose-Datei.
#
# Läuft bewusst auf einem GitHub-eigenen Runner (ubuntu-latest), NICHT auf dem NUC.
# Darum ist der Trigger pull_request hier unbedenklich: Code aus einem PR
# läuft nie in deinem Heimnetz.

name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Bauen und testen
        working-directory: backend
        run: mvn -B -ntp verify

      - name: Compose-Datei prüfen
        run: |
          cp .env.example .env
          docker compose --profile app config -q
